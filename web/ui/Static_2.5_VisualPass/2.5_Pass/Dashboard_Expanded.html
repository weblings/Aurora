<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="Dashboard_Expanded.css">
</head>
<body>
  <a class="anchor" id="frame"></a>
  <div class="frame">
    <div class="debug">
      <div class="container">
        <button class="button" type="button">Stop</button>
      </div>
      <div class="heading">
        <p class="aurora">Aurora</p>
      </div>
    </div>
    <div class="container">
      <div class="group">
        <button class="button" type="button">
          <video>Video</video>
        </button>
        <button class="button" type="button">
          <audio>Audio</audio>
        </button>
      </div>
    </div>
    <div class="container">
      <label>
        <p class="monitor">Monitor</p>
      </label>
      <button class="button" type="button">
        <div class="container">
          <p class="auto" primary>Auto (primary)</p>
        </div>
        <div class="container">
          <p class="▾">▾</p>
        </div>
      </button>
    </div>
    <div class="accordian">
      <div class="container">
        <p class="zone">Zone Mapping</p>
      </div>
      <div class="container">
        <p class="▾">▾</p>
      </div>
    </div>
    <div class="container">
      <div class="container">
        <div class="container">
          <button class="button" type="button">Auto-arrange zones</button>
        </div>
      </div>
      <div class="background+border">
        <div class="svg">
          <div class="vector"></div>
          <div class="vector"></div>
          <div class="vector"></div>
          <div class="vector"></div>
          <div class="vector"></div>
          <div class="vector"></div>
        </div>
        <div class="container">
          <p class="1">1</p>
          <p class="2">2</p>
          <p class="3">3</p>
          <p class="5">5</p>
          <div class="background+border"></div>
          <div class="background+border"></div>
          <div class="background+border"></div>
          <div class="background+border"></div>
          <p class="0">0</p>
          <p class="4">4</p>
        </div>
      </div>
      <div class="container">
        <div class="container">
          <div class="frame">
            <label>
              <p class="zone">Zone</p>
            </label>
            <div class="group">
              <p class="see">See all →</p>
            </div>
          </div>
          <button class="button" type="button">
            <div class="container">
              <p class="zone" Entranceway>Zone 0 (Entranceway)</p>
            </div>
            <div class="container">
              <p class="▾">▾</p>
            </div>
          </button>
        </div>
        <div class="frame">
          <label>
            <p class="active">Active</p>
          </label>
          <div class="container">
            <label>
              <div class="background">
                <div class="background"></div>
              </div>
            </label>
          </div>
        </div>
        <div class="container">
          <div class="container">
            <label>
              <p class="gamma">Gamma</p>
            </label>
            <div class="container">
              <p class="0 0">0.0</p>
            </div>
          </div>
          <div class="frame">
            <div class="group">
              <input autocomplete="on" type="text" name="">
              <input autocomplete="on" type="text" name="">
              <div class="background+border"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="container">
      <div class="container">
        <div class="accordian">
          <div class="container">
            <p class="tuning">Tuning</p>
          </div>
          <div class="container">
            <p class="▾">▾</p>
          </div>
        </div>
        <div class="container">
          <div class="container">
            <div class="container">
              <label>
                <p class="refresh" Hz>Refresh rate (Hz)</p>
              </label>
              <input autocomplete="on" type="text" name="">
            </div>
            <div class="container">
              <label>
                <p class="subsample" px>Subsample width (px) — 0 = auto</p>
              </label>
              <input autocomplete="on" type="text" name="">
            </div>
            <div class="container">
              <label>
                <p class="interpolation">Interpolation</p>
              </label>
              <button class="button" type="button">
                <div class="container">
                  <area>
                </div>
                <div class="container">
                  <p class="▾">▾</p>
                </div>
              </button>
            </div>
            <div class="container">
              <div class="container">
                <label>
                  <p class="transition">Transition smoothing</p>
                </label>
                <div class="container">
                  <p class="0 00">0.00</p>
                </div>
              </div>
              <div class="frame">
                <div class="group">
                  <input autocomplete="on" type="text" name="">
                  <input autocomplete="on" type="text" name="">
                  <div class="background+border"></div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="container">
        <div class="accordian">
          <div class="container">
            <p class="bridge">Bridge</p>
          </div>
          <div class="container">
            <p class="▾">▾</p>
          </div>
        </div>
        <div class="container">
          <div class="frame">
            <div class="container">
              <p class="connected">Connected to: 192.168.0.154</p>
            </div>
            <button class="button" type="button">Change bridge</button>
          </div>
          <div class="container">
            <label>
              <p class="entertainment">Entertainment configuration</p>
            </label>
            <button class="button" type="button">
              <div class="container">
                <p class="tv">TV</p>
              </div>
              <div class="container">
                <p class="▾">▾</p>
              </div>
            </button>
          </div>
          <div class="container">
            <label>
              <div class="container">
                <p class="zone" Entranceway>Zone 0 (Entranceway)</p>
              </div>
              <label>
                <div class="background">
                  <div class="background"></div>
                </div>
              </label>
            </label>
            <label>
              <div class="container">
                <p class="zone" Hue Play 1>Zone 1 (Hue Play 1)</p>
              </div>
              <label>
                <div class="background">
                  <div class="background"></div>
                </div>
              </label>
            </label>
            <label>
              <div class="container">
                <p class="zone" Hue Play 2>Zone 2 (Hue Play 2)</p>
              </div>
              <label>
                <div class="background">
                  <div class="background"></div>
                </div>
              </label>
            </label>
            <label>
              <div class="container">
                <p class="zone" Hue color lamp 1>Zone 3 (Hue color lamp 1)</p>
              </div>
              <label>
                <div class="background">
                  <div class="background"></div>
                </div>
              </label>
            </label>
            <label>
              <div class="container">
                <p class="zone" Hue color lamp 2>Zone 4 (Hue color lamp 2)</p>
              </div>
              <label>
                <div class="background">
                  <div class="background"></div>
                </div>
              </label>
            </label>
            <label>
              <div class="container">
                <p class="zone" Hue color lamp 3>Zone 5 (Hue color lamp 3)</p>
              </div>
              <label>
                <div class="background">
                  <div class="background"></div>
                </div>
              </label>
            </label>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
