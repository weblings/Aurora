<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>kep2 frame 7: only hidden</title>
  <link rel="stylesheet" href="../styles/tokens.css" />
  <link rel="stylesheet" href="../styles/page.css" />
  <link rel="stylesheet" href="../styles/shell.css" />
  <link rel="stylesheet" href="../styles/forms.css" />
  <link rel="stylesheet" href="../styles/dropdown.css" />
  <link rel="stylesheet" href="../styles/dashboard.css" />
  <link rel="stylesheet" href="../styles/tuning.css" />
  <link rel="stylesheet" href="mock.css" />
</head>
<body>
  <div id="screen-container">
    <div class="top-bar-slot db-top-bar-slot">
      <div class="top-bar top-bar-with-logo">
        <span></span>
        <h1 class="top-bar-title"><img src="../icons/aurora-logo.png" alt="Aurora" class="top-bar-logo" /></h1>
        <div class="top-bar-trailing">
          <button type="button" class="btn btn-secondary btn-icon" aria-label="Pause"><img src="../icons/pause-rockyroad.svg" alt="" class="top-bar-trailing-icon" /></button>
          <button type="button" class="btn btn-secondary btn-icon top-bar-power-btn" aria-label="Stop"><img src="../icons/power-svgrepo-com.svg" alt="" class="top-bar-trailing-icon" /></button>
        </div>
      </div>
    </div>
    <div class="db-controls mk-picker field">
      <label class="field-label" id="effects-label">Effects</label>
      <div class="dropdown dropdown-fill open">
        <button type="button" class="dropdown-trigger" aria-haspopup="dialog" aria-expanded="true"><span class="mk-trigger-main"><span class="dropdown-label">No effect selected</span></span><img src="../icons/chevron-down.svg" alt="" class="mk-chev" /></button>
        <div class="mk-panel-pop" role="dialog" aria-label="Choose effect">
        <div class="mk-scroll">
          <div class="mk-section"><h3 class="mk-group mk-group-toggle"><button type="button" id="g-hidden" aria-expanded="true" aria-controls="g-hidden-list"><img src="../icons/chevron-down.svg" alt="" class="mk-chev mk-twisty" /><span>Hidden</span></button></h3>
          <div role="radiogroup" id="g-hidden-list" aria-labelledby="g-hidden">
            <div class="mk-opt hov"><label><input type="radio" class="mk-radio" name="effect" aria-describedby="screen-colors-tip" /><span class="mk-check" aria-hidden="true"></span><span class="mk-opt-text"><span class="mk-opt-name">Screen colors</span><div class="mk-opt-secondary">Built-in</div></span></label><button type="button" class="mk-more" aria-label="Actions for Screen colors" aria-haspopup="menu" aria-expanded="false">&#8943;</button><div class="mk-tip" role="tooltip" id="screen-colors-tip">Matches the lights to the colors at the edges of your screen.</div></div>
            <div class="mk-opt"><label><input type="radio" class="mk-radio" name="effect" aria-describedby="music-pulse-tip" /><span class="mk-check" aria-hidden="true"></span><span class="mk-opt-text"><span class="mk-opt-name">Music pulse</span><div class="mk-opt-secondary">Built-in</div></span></label><button type="button" class="mk-more" aria-label="Actions for Music pulse" aria-haspopup="menu" aria-expanded="false">&#8943;</button><div class="mk-tip" role="tooltip" id="music-pulse-tip">Pulses the lights with the beat of whatever is playing.</div></div>
          </div></div>
        </div>
          <div class="mk-foot"><button type="button" class="mk-new">+ New effect</button></div>
        </div>
      </div>
    </div>
    <div class="db-top-tier">
      <div class="db-device-slot"></div>
    </div>
    <div class="db-accordions">
      <div><div class="accordion-section"><button type="button" class="accordion-header" aria-expanded="false"><span class="accordion-title">Zone Mapping</span><span class="accordion-chevron" aria-hidden="true"></span></button><div class="accordion-content" hidden></div></div></div>
      <div><div class="accordion-section"><button type="button" class="accordion-header" aria-expanded="false"><span class="accordion-title">Tuning</span><span class="accordion-chevron" aria-hidden="true"></span></button><div class="accordion-content" hidden></div></div></div>
      <div><div class="accordion-section"><button type="button" class="accordion-header" aria-expanded="false"><span class="accordion-title">Output</span><span class="accordion-chevron" aria-hidden="true"></span></button><div class="accordion-content" hidden></div></div></div>
      <div><div class="accordion-section"><button type="button" class="accordion-header" aria-expanded="false"><span class="accordion-title">Paired devices</span><span class="accordion-chevron" aria-hidden="true"></span></button><div class="accordion-content" hidden></div></div></div>
    </div>
    <div class="db-version"><p>v1.1.4</p></div>
  </div>
</body>
</html>
