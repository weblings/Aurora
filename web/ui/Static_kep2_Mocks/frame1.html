<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>kep2 frame 1: effect popup</title>
  <link rel="stylesheet" href="../styles/tokens.css" />
  <link rel="stylesheet" href="../styles/page.css" />
  <link rel="stylesheet" href="../styles/shell.css" />
  <link rel="stylesheet" href="../styles/forms.css" />
  <link rel="stylesheet" href="../styles/dropdown.css" />
  <link rel="stylesheet" href="../styles/dashboard.css" />
  <link rel="stylesheet" href="../styles/tuning.css" />
  <link rel="stylesheet" href="mock.css" />
</head>
<body>
  <div id="screen-container">
    <div class="top-bar-slot db-top-bar-slot">
      <div class="top-bar top-bar-with-logo">
        <span></span>
        <h1 class="top-bar-title"><img src="../icons/aurora-logo.png" alt="Aurora" class="top-bar-logo" /></h1>
        <div class="top-bar-trailing">
          <button type="button" class="btn btn-secondary btn-icon" aria-label="Pause"><img src="../icons/pause-rockyroad.svg" alt="" class="top-bar-trailing-icon" /></button>
          <button type="button" class="btn btn-secondary btn-icon top-bar-power-btn" aria-label="Stop"><img src="../icons/power-svgrepo-com.svg" alt="" class="top-bar-trailing-icon" /></button>
        </div>
      </div>
    </div>
    <div class="db-controls mk-picker">
      <div class="dropdown dropdown-fill open">
        <button type="button" class="dropdown-trigger" aria-haspopup="dialog" aria-expanded="true"><span class="mk-trigger-main"><span class="dropdown-label">Fire</span></span><img src="../icons/chevron-down.svg" alt="" class="mk-chev" /></button>
        <div class="mk-panel-pop" role="dialog" aria-label="Choose effect">
          <fieldset role="radiogroup" aria-labelledby="g-builtin"><legend class="mk-group" id="g-builtin">Built-in</legend>
            <div class="mk-opt"><label><input type="radio" class="mk-radio" name="effect" /><span class="mk-check" aria-hidden="true"></span><span class="mk-opt-text"><span class="mk-opt-name">Screen colors<span class="mk-icons"><span role="img" aria-label="Video" title="Video"><svg class="mk-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="1.5" y="2.5" width="13" height="8.5" rx="1"/><path d="M5.5 14h5M8 11v3"/></svg></span></span></span></span></label><button type="button" class="mk-more" aria-label="Actions for Screen colors" aria-haspopup="menu" aria-expanded="false">&#8943;</button></div>
            <div class="mk-opt"><label><input type="radio" class="mk-radio" name="effect" /><span class="mk-check" aria-hidden="true"></span><span class="mk-opt-text"><span class="mk-opt-name">Music pulse<span class="mk-icons"><span role="img" aria-label="Audio" title="Audio"><svg class="mk-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6h2.5L8 3v10L4.5 10H2z"/><path d="M10.5 5.5a3.5 3.5 0 0 1 0 5M12.5 3.5a6 6 0 0 1 0 9"/></svg></span></span></span></span></label><button type="button" class="mk-more" aria-label="Actions for Music pulse" aria-haspopup="menu" aria-expanded="false">&#8943;</button></div>
          </fieldset>
          <fieldset role="radiogroup" aria-labelledby="g-custom"><legend class="mk-group" id="g-custom">Custom</legend>
            <div class="mk-opt selected"><label><input type="radio" class="mk-radio" name="effect" checked /><span class="mk-check" aria-hidden="true">&#10003;</span><span class="mk-opt-text"><span class="mk-opt-name">Fire<span class="mk-icons"><span role="img" aria-label="Audio" title="Audio"><svg class="mk-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6h2.5L8 3v10L4.5 10H2z"/><path d="M10.5 5.5a3.5 3.5 0 0 1 0 5M12.5 3.5a6 6 0 0 1 0 9"/></svg></span></span></span></span></label><button type="button" class="mk-more" aria-label="Actions for Fire" aria-haspopup="menu" aria-expanded="false">&#8943;</button></div>
            <div class="mk-opt"><label><input type="radio" class="mk-radio" name="effect" /><span class="mk-check" aria-hidden="true"></span><span class="mk-opt-text"><span class="mk-opt-name">Rainbow drift<span class="mk-icons"><span role="img" aria-label="Video" title="Video"><svg class="mk-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="1.5" y="2.5" width="13" height="8.5" rx="1"/><path d="M5.5 14h5M8 11v3"/></svg></span><span role="img" aria-label="Audio" title="Audio"><svg class="mk-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6h2.5L8 3v10L4.5 10H2z"/><path d="M10.5 5.5a3.5 3.5 0 0 1 0 5M12.5 3.5a6 6 0 0 1 0 9"/></svg></span></span></span></span></label><button type="button" class="mk-more open" aria-label="Actions for Rainbow drift" aria-haspopup="menu" aria-expanded="true">&#8943;</button><div class="mk-rowmenu" role="menu"><button type="button" class="dropdown-option" role="menuitem">Edit graph</button><button type="button" class="dropdown-option" role="menuitem">Rename</button><button type="button" class="dropdown-option" role="menuitem">Duplicate</button><button type="button" class="dropdown-option" role="menuitem">Move up</button><button type="button" class="dropdown-option" role="menuitem">Move down</button><button type="button" class="dropdown-option dropdown-option-divided" role="menuitem">Delete</button></div></div>
            <div class="mk-opt gated"><label><input type="radio" class="mk-radio" name="effect" disabled aria-describedby="candle-why" /><span class="mk-check" aria-hidden="true"></span><span class="mk-opt-text"><span class="mk-opt-name">Candle<span class="mk-icons"><span role="img" aria-label="Video" title="Video"><svg class="mk-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="1.5" y="2.5" width="13" height="8.5" rx="1"/><path d="M5.5 14h5M8 11v3"/></svg></span></span></span><div class="mk-opt-reason" id="candle-why">Needs a video input. Connect the Hue bridge first.</div></span></label></div>
          </fieldset>
          <div class="mk-foot"><button type="button" class="mk-new">+ New effect</button></div>
        </div>
      </div>
    </div>
    <div class="db-top-tier">
      <div class="db-device-slot"><p class="status-text device-field-hint">Uses your system's default audio device.</p></div>
    </div>
    <div class="db-accordions">
      <div><div class="accordion-section"><button type="button" class="accordion-header" aria-expanded="false"><span class="accordion-title">Zone Mapping</span><span class="accordion-chevron" aria-hidden="true"></span></button><div class="accordion-content" hidden></div></div></div>
      <div><div class="accordion-section"><button type="button" class="accordion-header" aria-expanded="false"><span class="accordion-title">Tuning</span><span class="accordion-chevron" aria-hidden="true"></span></button><div class="accordion-content" hidden></div></div></div>
      <div><div class="accordion-section"><button type="button" class="accordion-header" aria-expanded="false"><span class="accordion-title">Output</span><span class="accordion-chevron" aria-hidden="true"></span></button><div class="accordion-content" hidden></div></div></div>
      <div><div class="accordion-section"><button type="button" class="accordion-header" aria-expanded="false"><span class="accordion-title">Paired devices</span><span class="accordion-chevron" aria-hidden="true"></span></button><div class="accordion-content" hidden></div></div></div>
    </div>
    <div class="db-version"><p>v1.1.4</p></div>
  </div>
</body>
</html>
