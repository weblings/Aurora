<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Graph editor mock on Grille</title>
  <link rel="stylesheet" href="grille/fonts.css" />
  <link rel="stylesheet" href="grille/tokens.css" />
  <link rel="stylesheet" href="grille/ui.css" />
  <link rel="stylesheet" href="mock.css" />
  <link rel="stylesheet" href="buttons.css" />
  <link rel="stylesheet" href="sizes.css" />
</head>
<body>
  <nav class="mk-frames" id="frames" aria-label="Mock frames"></nav>
  <div class="ge">
    <header class="ge-bar" id="bar"></header>
    <main class="ge-canvas" id="canvas" tabindex="0" aria-label="Graph canvas">
      <div class="ge-world" id="world">
        <svg class="ge-wires" id="wires" aria-hidden="true"></svg>
        <div id="nodes"></div>
      </div>
      <div class="ge-island ge-tl"><button type="button" class="ui-button" data-act="add"><svg class="ge-icon ge-vs" viewBox="0 0 32 32" aria-hidden="true"><path d="M17.1336 24.6659C17.5018 24.6659 17.8003 24.3675 17.8003 23.9993V17.9324C17.8003 17.8588 17.86 17.7991 17.9336 17.7991H23.9999C24.3681 17.7991 24.6666 17.5006 24.6666 17.1324V14.8657C24.6666 14.4976 24.3681 14.1991 23.9999 14.1991L17.9336 14.1991C17.86 14.1991 17.8003 14.1394 17.8003 14.0657V7.99928C17.8003 7.63109 17.5018 7.33261 17.1336 7.33261H14.867C14.4988 7.33261 14.2003 7.63109 14.2003 7.99928V14.0657C14.2003 14.1394 14.1406 14.1991 14.067 14.1991L7.99992 14.1991C7.63173 14.1991 7.33325 14.4976 7.33325 14.8658V17.1324C7.33325 17.5006 7.63173 17.7991 7.99992 17.7991L14.067 17.7991C14.1406 17.7991 14.2003 17.8588 14.2003 17.9324V23.9993C14.2003 24.3675 14.4988 24.6659 14.867 24.6659H17.1336Z"/></svg>Add node</button></div>
      <div class="ge-island ge-tr" id="preview"></div>
      <div class="ge-island ge-br"><button type="button" class="ui-button" data-act="controls" id="controls-btn"></button></div>
      <div class="ge-island ge-bl"><div class="ge-minimap" id="minimap" hidden></div><button type="button" class="ui-button" data-act="view" id="view-btn"></button></div>
      <a class="ge-credit" href="https://reactflow.dev" target="_blank" rel="noopener noreferrer" aria-label="React Flow attribution">React Flow</a>
    </main>
  </div>
  <div class="s6" id="board" hidden></div>
  <div id="layer"></div>
  <div class="ge-toast" id="toast" role="status" hidden></div>
  <script src="catalog.js"></script>
  <script src="buttons.js"></script>
  <script src="sizes.js"></script>
  <script src="mock.js"></script>
</body>
</html>
