<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aurora Demo</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #111318; }
    canvas { display: block; }
    #toggle-grid, #toggle-backdrop-bounds, #toggle-rect-debug, #source-mode, #light-rig, #audio-color-model {
      position: fixed; left: 16px; z-index: 1;
      font: 14px system-ui, sans-serif; padding: 8px 12px;
      background: rgba(20, 22, 28, 0.75); color: #e8eaf0;
      border: 1px solid #4a4f5c; border-radius: 6px; cursor: pointer;
    }
    #toggle-grid { top: 16px; }
    #toggle-backdrop-bounds { top: 56px; }
    #toggle-rect-debug { top: 96px; }
    #source-mode { top: 136px; }
    #light-rig { top: 176px; }
    #audio-color-model { top: 216px; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"
      }
    }
  </script>
  <style>
    #room-status { position: fixed; left: 16px; top: 256px; z-index: 1; font: 14px system-ui, sans-serif; color: #e8eaf0; }
  </style>
</head>
<body>
  <button id="toggle-grid" type="button">Show zone grid</button>
  <button id="toggle-backdrop-bounds" type="button">Hide backdrop bounds</button>
  <button id="toggle-rect-debug" type="button">Hide rect-light quads</button>
  <select id="source-mode">
    <option value="video" selected>Real video</option>
    <option value="rainbow">Rainbow test pattern</option>
    <option value="white">White test pattern</option>
    <option value="audio">Audio (Electro Cabello)</option>
  </select>
  <select id="light-rig">
    <option value="rectArea" selected>Rect-area lights (edges)</option>
    <option value="room">TV Room (3D model)</option>
  </select>
  <select id="audio-color-model">
    <option value="placeholder" selected>Audio color: placeholder (hue jump)</option>
    <option value="ported">Audio color: ported (drift + bounce)</option>
  </select>
  <div id="room-status" hidden></div>
  <script type="module" src="main.js"></script>
</body>
</html>
