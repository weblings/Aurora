<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aurora Demo</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #111318; }
    canvas { display: block; }
    #toggle-grid {
      position: fixed; top: 16px; left: 16px; z-index: 1;
      font: 14px system-ui, sans-serif; padding: 8px 12px;
      background: rgba(20, 22, 28, 0.75); color: #e8eaf0;
      border: 1px solid #4a4f5c; border-radius: 6px; cursor: pointer;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <button id="toggle-grid" type="button">Show zone grid</button>
  <script type="module" src="main.js"></script>
</body>
</html>
