<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aurora Demo</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #111318; }
    canvas { display: block; }
    #toggle-grid, #toggle-backdrop-bounds, #toggle-rect-debug, #source-mode, #light-rig, #audio-color-model {
      position: fixed; left: 16px; z-index: 1;
      font: 14px system-ui, sans-serif; padding: 8px 12px;
      background: rgba(20, 22, 28, 0.75); color: #e8eaf0;
      border: 1px solid #4a4f5c; border-radius: 6px; cursor: pointer;
    }
    /* toggle-grid/backdrop-bounds/rect-debug, light-rig, and audio-color-model are hidden for
       now -- see each select's own comment in the body below for why. */
    #source-mode { top: 16px; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"
      }
    }
  </script>
  <style>
    #room-status { position: fixed; left: 16px; top: 56px; z-index: 1; font: 14px system-ui, sans-serif; color: #e8eaf0; }
  </style>
</head>
<body>
  <!-- Flat-scene-only debug controls -- hidden while the 3D room is the only light rig
       (see #light-rig below); un-hide alongside re-adding rectArea for the XR pass. -->
  <button id="toggle-grid" type="button" hidden>Show zone grid</button>
  <button id="toggle-backdrop-bounds" type="button" hidden>Hide backdrop bounds</button>
  <button id="toggle-rect-debug" type="button" hidden>Hide rect-light quads</button>
  <select id="source-mode">
    <option value="video" selected>Real video</option>
    <option value="rainbow">Rainbow test pattern</option>
    <option value="audio">Audio (Electro Cabello)</option>
  </select>
  <!-- rectArea temporarily removed (not deleted -- see main.js's buildRectAreaLights) until the
       XR pass; only one option left, so the picker itself is hidden too. -->
  <select id="light-rig" hidden>
    <option value="room" selected>TV Room (3D model)</option>
  </select>
  <!-- placeholder/ported/attack A/B/D options removed (not deleted -- see main.js's
       placeholderAudioColor/dampedAudioColor/attackAudioColor) -- settled on 'tuned' for now. -->
  <select id="audio-color-model" hidden>
    <option value="tuned" selected>Audio color: tuned (punchier brightness)</option>
  </select>
  <div id="room-status" hidden></div>
  <script type="module" src="main.js"></script>
</body>
</html>
