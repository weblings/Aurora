<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aurora Demo</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <!-- PNG fallbacks for tab chrome that can't do SVG favicons (notably
     Safari): one per color scheme, matched declaratively. -->
  <link rel="icon" type="image/png" media="(prefers-color-scheme: light)" href="favicon-light.png" />
  <link rel="icon" type="image/png" media="(prefers-color-scheme: dark)" href="favicon-dark.png" />
  <link rel="stylesheet" href="vendor/webui/styles/tokens.css" />
  <link rel="stylesheet" href="vendor/webui/styles/shell.css" />
  <link rel="stylesheet" href="vendor/webui/styles/dashboard.css" />
  <link rel="stylesheet" href="vendor/webui/styles/tuning.css" />
  <link rel="stylesheet" href="vendor/webui/styles/dropdown.css" />
  <link rel="stylesheet" href="vendor/webui/styles/forms.css" />
  <link rel="stylesheet" href="vendor/webui/styles/zone-mapping.css" />
  <link rel="stylesheet" href="demo-layout.css" />
  <style>
    /* Scene-pane overlay controls: absolute within #scene-pane (was fixed
       when the scene was fullscreen). Untouched until the Phase 4 source
       handover removes #source-mode in favor of the Dashboard toggle. */
    #toggle-grid, #toggle-backdrop-bounds, #toggle-rect-debug, #light-rig, #audio-color-model {
      position: absolute; left: 16px; z-index: 1;
      font: 14px system-ui, sans-serif; padding: 8px 12px;
      background: rgba(20, 22, 28, 0.75); color: #e8eaf0;
      border: 1px solid #4a4f5c; border-radius: 6px; cursor: pointer;
    }
    /* toggle-grid/backdrop-bounds/rect-debug, light-rig, and audio-color-model are hidden for
       now -- see each select's own comment in the body below for why. */
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/build/three.module.js",
        "three/addons/": "./vendor/three/examples/jsm/"
      }
    }
  </script>
  <style>
    #room-status { position: absolute; left: 16px; top: 56px; z-index: 1; font: 14px system-ui, sans-serif; color: #e8eaf0; }
  </style>
</head>
<body>
  <div id="demo-split">
    <div id="scene-pane">
      <!-- Flat-scene-only debug controls -- hidden while the 3D room is the only light rig
           (see #light-rig below); un-hide alongside re-adding rectArea for the XR pass. -->
      <button id="toggle-grid" type="button" hidden>Show zone grid</button>
      <button id="toggle-backdrop-bounds" type="button" hidden>Hide backdrop bounds</button>
      <button id="toggle-rect-debug" type="button" hidden>Hide rect-light quads</button>
      <!-- Phase 4 source handover: the Dashboard Audio/Video toggle is the
           only source selector now (wired via applyLiveTuning). The old
           dropdown is removed; 'rainbow' is disabled but its code path stays
           for later. -->
      <!-- rectArea temporarily removed (not deleted -- see rectarea-rig.js's buildRectAreaLights) until the
           XR pass; only one option left, so the picker itself is hidden too. -->
      <select id="light-rig" hidden>
        <option value="room" selected>TV Room (3D model)</option>
      </select>
      <!-- placeholder/ported/attack A/B/D options removed (not deleted -- see main.js's
           placeholderAudioColor/dampedAudioColor/attackAudioColor). Disabled, not just hidden --
           this dropdown isn't wired for real use right now. 'midpoint' is the 5th pass this would
           have selected: halfway between 'ported' and 'tuned', now also native's own Config.hpp
           default. -->
      <select id="audio-color-model" hidden disabled>
        <option value="tuned">Audio color: tuned (punchier brightness)</option>
        <option value="midpoint" selected>Audio color: midpoint (halfway to tuned)</option>
      </select>
      <div id="room-status" hidden></div>
      <!-- Repo badge (Aurora-9mq): the RockyRoad badge-to-repo pattern, a
           pill pointing at the repo overlaid at the bottom of the scene.
           Sizing/offset contract lives in demo-layout.css. -->
      <a id="repo-pill" href="https://github.com/weblings/Aurora" target="_blank" rel="noopener noreferrer"><svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M6.766 11.328c-2.063-.25-3.516-1.734-3.516-3.656 0-.781.281-1.625.75-2.188-.203-.515-.172-1.609.063-2.062.625-.078 1.468.25 1.968.703.594-.187 1.219-.281 1.985-.281.765 0 1.39.094 1.953.265.484-.437 1.344-.765 1.969-.687.218.422.25 1.515.046 2.047.5.593.766 1.39.766 2.203 0 1.922-1.453 3.375-3.547 3.64.531.344.89 1.094.89 1.954v1.625c0 .468.391.734.86.547C13.781 14.359 16 11.53 16 8.03 16 3.61 12.406 0 7.984 0 3.563 0 0 3.61 0 8.031a7.88 7.88 0 0 0 5.172 7.422c.422.156.828-.125.828-.547v-1.25c-.219.094-.5.156-.75.156-1.031 0-1.64-.562-2.078-1.609-.172-.422-.36-.672-.719-.719-.187-.015-.25-.093-.25-.187 0-.188.313-.328.625-.328.453 0 .844.281 1.25.86.313.452.64.655 1.031.655s.641-.14 1-.5c.266-.265.47-.5.657-.656"/></svg>View Source Code</a>
    </div>
    <div id="dashboard-pane">
      <div id="screen-container" class="db-port"></div>
    </div>
  </div>
  <script type="module" src="main.js"></script>
  <script type="module" src="demo-boot.js"></script>
</body>
</html>
