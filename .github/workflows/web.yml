# Web slices (zero-install demo + static WebUI). No build step: runs the
# node unit tests directly. Runs only when web-facing paths change.
name: web

on:
  push:
    branches: [main]
    paths:
      - web/**
      - web-processing/**
      - core/Runtime/src/Graph/**
      - core/Runtime/src/ControlDescriptorTables.cpp
      - core/Runtime/include/Aurora/Runtime/Config.hpp
      - output/hue/src/HueControlDescriptors.cpp
      - input/*/src/InputControlDescriptors.cpp
      - docs/api/**
      - .github/workflows/web.yml
  pull_request:
    paths:
      - web/**
      - web-processing/**
      - core/Runtime/src/Graph/**
      - core/Runtime/src/ControlDescriptorTables.cpp
      - core/Runtime/include/Aurora/Runtime/Config.hpp
      - output/hue/src/HueControlDescriptors.cpp
      - input/*/src/InputControlDescriptors.cpp
      - docs/api/**
      - .github/workflows/web.yml

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Web unit tests
        run: |
          for t in web-processing/*.test.mjs web/demo/*.test.mjs web/demo/vendor/webui/*.test.mjs web/ui/*.test.mjs web/ui/screens/*.test.mjs web/ui/styles/*.test.mjs; do node "$t"; done
      - name: Demo vendor closure (every module the Dashboard imports is vendored)
        run: node web/demo/vendor/webui/closure-check.mjs
      - name: Generated files are current (demo graph, descriptors)
        run: |
          python3 web/demo/gen-demo-graph.py --check
          python3 web/demo/vendor/webui/gen-descriptors.py --check
      - name: API spec is valid and openapi.json is current
        run: |
          python3 -m venv "$RUNNER_TEMP/apispec"
          "$RUNNER_TEMP/apispec/bin/pip" install -q -r docs/api/requirements.txt
          "$RUNNER_TEMP/apispec/bin/python" docs/api/gen-openapi.py --check

  graph-editor:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/graph-editor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Vitest
        run: npm test
