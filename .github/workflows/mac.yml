# Mac native stack. Runs only when its slice (or core/) changes.
# arm64 runner, matching the platform the parity fixtures were generated on.
# NOTE: written blind -- expect the first live run to need tweaks (capture
# tests that need ScreenCaptureKit/audio permissions are the likely culprit);
# fix forward here. Builds are ad-hoc signed; notarization stays manual.
name: mac

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - core/**
      - input/mac/**
      - output/hue/**
      - adapters/**
      - app/mac/**
      - web/graph-editor/**
      - CMakeLists.txt
      - CMakePresets.json
      - .github/workflows/mac.yml
  pull_request:
    paths:
      - core/**
      - input/mac/**
      - output/hue/**
      - adapters/**
      - app/mac/**
      - web/graph-editor/**
      - CMakeLists.txt
      - CMakePresets.json
      - .github/workflows/mac.yml

concurrency:
  group: mac-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # mbedtls@3 is keg-only and plain `mbedtls` is v4 (incompatible API):
      # pin v3 for pkg-config and link it (CONTRIBUTING.md#platform-notes).
      - name: Install deps
        run: |
          brew install cmake opencv curl aubio mbedtls@3 pkg-config
          brew link mbedtls@3 --force
          echo "PKG_CONFIG_PATH=$(brew --prefix mbedtls@3)/lib/pkgconfig" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Compiler cache. The action keys on OS/arch (macos-latest is arm64).
      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: mac-${{ runner.arch }}
      - name: Configure
        env:
          CCACHE_BASEDIR: ${{ github.workspace }}
        run: |
          cmake --preset mac-app -DAURORA_ENABLE_GRAPH_EDITOR=ON \
            -DAURORA_BUILD_CORE_TESTS=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build
        env:
          CCACHE_BASEDIR: ${{ github.workspace }}
        run: cmake --build build/mac-app
      - name: Test
        run: ctest --test-dir build/mac-app --output-on-failure --timeout 120
