# Windows native stack. Runs only when its slice (or core/) changes.
# NOTE: written blind from a sandbox without MSVC or runners --
# the OpenCV_DIR below is the first thing to suspect on a red run.
name: windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - core/**
      - input/windows/**
      - output/hue/**
      - adapters/**
      - app/windows/**
      - web/graph-editor/**
      - CMakeLists.txt
      - CMakePresets.json
      - .github/workflows/windows.yml
  pull_request:
    paths:
      - core/**
      - input/windows/**
      - output/hue/**
      - adapters/**
      - app/windows/**
      - web/graph-editor/**
      - CMakeLists.txt
      - CMakePresets.json
      - .github/workflows/windows.yml

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # OpenCV stays on choco: vcpkg's opencv4 default features take ~40 min
      # to build (docs/Building.md). The rest come from the runner's vcpkg.
      - name: Install OpenCV
        run: |
          choco install opencv -y
          # Only the app exe gets its DLLs copied beside it; the test
          # executables find OpenCV's through PATH.
          "C:\tools\opencv\build\x64\vc16\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg-bincache
          # Image version in the key: vcpkg's ABI hash changes with the MSVC
          # image, and a fixed key never re-saves (0 packages restored).
          key: vcpkg-${{ runner.os }}-${{ env.ImageVersion }}-v2
      - name: Install vcpkg deps
        env:
          VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-bincache
        run: |
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install curl:x64-windows mbedtls:x64-windows "aubio[core]:x64-windows" miniaudio:x64-windows
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Ninja needs cl.exe on PATH. Release has no /Zi, so sccache works
      # without /Z7 (RelWithDebInfo would need CMAKE_MSVC_DEBUG_INFORMATION_FORMAT).
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: mozilla-actions/sccache-action@v0.0.9
      - name: Configure
        env:
          SCCACHE_GHA_ENABLED: "true"
        run: >
          cmake --preset windows-app -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER_LAUNCHER=sccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DOpenCV_DIR="C:/tools/opencv/build"
          -DAURORA_ENABLE_GRAPH_EDITOR=ON
          -DAURORA_BUILD_CORE_TESTS=ON
      - name: Build
        env:
          SCCACHE_GHA_ENABLED: "true"
        run: cmake --build build/windows-app
      - name: Test
        run: ctest --test-dir build/windows-app --output-on-failure --timeout 120
      - name: sccache stats
        if: always()
        run: sccache --show-stats
