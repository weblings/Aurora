# Demo site (zero-install static demo). No build step: uploads web/demo/
# as-is to GitHub Pages, so the demo lands on the domain apex
# (https://weblings.github.io/Aurora/) as the README promises. Requires
# Pages set to the "GitHub Actions" source in repo settings (one-time).
name: demo-pages

on:
  push:
    branches: [main]
    paths:
      - web/demo/**
      - .github/workflows/demo-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/demo
      - id: deployment
        uses: actions/deploy-pages@v4
