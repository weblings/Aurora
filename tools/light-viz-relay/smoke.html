<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>light-viz-relay smoke test</title>
<style>
  body { background: #111; color: #eee; font: 14px monospace; padding: 16px; }
  #status { margin-bottom: 12px; }
  #zones { display: flex; flex-wrap: wrap; gap: 8px; }
  .zone {
    width: 120px; height: 80px; border: 1px solid #444; border-radius: 4px;
    display: flex; align-items: center; justify-content: center;
    text-shadow: 0 0 3px #000, 0 0 3px #000;
  }
</style>
</head>
<body>
<!--
  Throwaway diagnostic page, not part of the real viz tool (that's
  web/demo/viz.html, built once the main.js refactor lands -- see
  Aurora-gj0.5/.6). Purpose: settle the live-data shape/cadence coming out
  of the relay before any scene code depends on assumptions about it, and
  give a fast eyes-on check that HueOutput's real per-zone colors are
  actually arriving. No three.js, no build step -- open this file directly
  in a browser (or serve tools/light-viz-relay/ with any static server)
  while relay.py is running.
-->
<div id="status">connecting...</div>
<div id="zones"></div>
<div id="log"></div>
<script>
  const statusEl = document.getElementById('status');
  const zonesEl = document.getElementById('zones');
  const logEl = document.getElementById('log');

  let frameCount = 0;
  let lastFrameAt = performance.now();

  const source = new EventSource('http://127.0.0.1:18245/events');

  source.onopen = () => { statusEl.textContent = 'connected'; };
  source.onerror = () => { statusEl.textContent = 'connection error / reconnecting...'; };

  source.onmessage = (event) => {
    const now = performance.now();
    const intervalMs = now - lastFrameAt;
    lastFrameAt = now;
    frameCount += 1;

    let payload;
    try {
      payload = JSON.parse(event.data);
    } catch (err) {
      logEl.textContent = `parse error: ${err}`;
      return;
    }

    statusEl.textContent =
      `connected -- frame ${frameCount}, ${intervalMs.toFixed(0)}ms since last, ${payload.zones.length} zones`;

    zonesEl.innerHTML = '';
    for (const zone of payload.zones) {
      const div = document.createElement('div');
      div.className = 'zone';
      const r = Math.round(zone.r * 255);
      const g = Math.round(zone.g * 255);
      const b = Math.round(zone.b * 255);
      div.style.background = `rgb(${r}, ${g}, ${b})`;
      div.textContent = `id ${zone.id}`;
      zonesEl.appendChild(div);
    }
  };
</script>
</body>
</html>
